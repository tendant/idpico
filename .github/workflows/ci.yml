name: CI

# Verification only: nothing is published or released from GitHub.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files need gofmt:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Build (static Linux binaries, as the Dockerfile does)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          go build -o /dev/null ./cmd/idp
          go build -o /dev/null ./cmd/idpctl

      - name: Container image builds (not pushed)
        run: docker build -t simple-idp:ci .
