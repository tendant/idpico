name: CI

# Verification only: nothing is published or released from GitHub.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/oidc-client/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files need gofmt:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: make vet

      - name: go test
        run: go test -race -count=1 ./...

      - name: OIDC flow as an external client (scripts/test-client.sh)
        run: make test-flow

      # Black-box OIDC conformance: starts an isolated server and tests it
      # over HTTP only (see CONFORMANCE.md).
      - name: Conformance suite
        run: make validate-conformance

      # Login through an independent go-oidc relying party.
      - name: Interoperability (examples/oidc-client)
        run: make validate-interop

      - name: Build (static Linux binaries, as the Dockerfile does)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          go build -o /dev/null ./cmd/idpico
          go build -o /dev/null ./cmd/idpicoctl

      - name: Container image builds (not pushed)
        run: docker build -t idpico:ci .
