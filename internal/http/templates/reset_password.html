{{define "title"}}Reset Password{{end}}
{{define "content"}}
<h1>Choose a New Password</h1>
{{if .Error}}<div class="error">{{.Error}}</div>{{end}}
<form method="POST" action="/reset-password">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="token" value="{{.Token}}">
    <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" minlength="{{.MinLength}}" required autofocus autocomplete="new-password">
    </div>
    <div class="form-group">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm" minlength="{{.MinLength}}" required autocomplete="new-password">
    </div>
    <button type="submit">Set password</button>
</form>
{{end}}
