{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "title" .}} - Simple IdP</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            color: #333;
            margin: 0;
            font-size: 15px;
        }
        header {
            background: #1f2937;
            color: white;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }
        header .brand { font-weight: 600; font-size: 17px; color: white; text-decoration: none; }
        header nav a { color: #d1d5db; text-decoration: none; margin-left: 20px; font-size: 14px; }
        header nav a:hover { color: white; }
        main { max-width: 1100px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px 0; }
        h2 { font-size: 16px; font-weight: 600; margin: 28px 0 12px 0; }
        p { line-height: 1.5; }
        .muted { color: #6b7280; font-size: 13px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        pre {
            background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 6px;
            overflow-x: auto; font-size: 12.5px; line-height: 1.45; margin: 0;
            white-space: pre-wrap; word-break: break-all;
        }
        code { background: #f3f4f6; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
        label { display: block; font-weight: 500; font-size: 13px; color: #555; margin-bottom: 6px; }
        label.check { display: inline-flex; align-items: center; gap: 6px; font-weight: normal; font-size: 14px; color: #333; margin: 0 16px 8px 0; }
        select, input[type="text"] { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; font-family: inherit; }
        .form-row { margin-bottom: 16px; }
        button, .button {
            display: inline-block; padding: 8px 14px; background: #2563eb; color: white; border: none;
            border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; margin-right: 8px;
        }
        button:hover, .button:hover { background: #1d4ed8; }
        button.secondary, .button.secondary { background: #e5e7eb; color: #111; }
        button.secondary:hover, .button.secondary:hover { background: #d1d5db; }
        form.inline { display: inline; }
        .flash { padding: 12px 14px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
        .flash.ok { background: #d1fae5; color: #065f46; }
        .flash.err { background: #fee2e2; color: #991b1b; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; background: #dbeafe; color: #1e40af; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: top; }
        th { color: #555; font-weight: 600; width: 180px; }
        a { color: #2563eb; }
    </style>
</head>
<body>
    <header>
        <div>
            <a class="brand" href="/">Simple IdP</a>
            <nav style="display:inline">
                <a href="/playground">Playground</a>
                <a href="/.well-known/openid-configuration">Discovery</a>
                <a href="/admin">Admin</a>
            </nav>
        </div>
        <div></div>
    </header>
    <main>
        {{if .Flash}}<div class="flash ok">{{.Flash}}</div>{{end}}
        {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
        {{template "content" .}}
    </main>
</body>
</html>{{end}}
