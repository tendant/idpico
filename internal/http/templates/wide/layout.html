{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{template "title" .}} - IDPico</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="128x128" href="{{asset "icon.png"}}">
    <link rel="apple-touch-icon" href="{{asset "icon.png"}}">
    <link rel="stylesheet" href="{{asset "style.css"}}">
</head>
<body>
    <header class="site">
        <div>
            <a class="brand" href="/"><img src="{{asset "icon.png"}}" alt="">IDPico</a>
            <nav>
                <a href="/playground" class="active">Playground</a>
                <a href="/.well-known/openid-configuration">Discovery</a>
                <a href="/admin">Admin</a>
            </nav>
        </div>
        <div></div>
    </header>
    <main>
        {{if .Flash}}<div class="flash ok">{{.Flash}}</div>{{end}}
        {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
        {{template "content" .}}
    </main>
</body>
</html>{{end}}
