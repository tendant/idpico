{{define "title"}}Dashboard{{end}}
{{define "content"}}
<h1>Dashboard</h1>
<div class="grid">
    <div class="stat"><div class="n">{{.UserCount}}</div><a href="/admin/users">Users</a></div>
    <div class="stat"><div class="n">{{.GroupCount}}</div><a href="/admin/groups">Groups</a></div>
    <div class="stat"><div class="n">{{.ClientCount}}</div><a href="/admin/clients">Clients</a></div>
    <div class="stat"><div class="n">{{.KeyCount}}</div><a href="/admin/keys">Signing keys</a></div>
</div>
<div class="card" style="margin-top:24px">
    <h2>Issuer</h2>
    <p><code>{{.IssuerURL}}</code></p>
    <p class="muted">Discovery: <a href="{{.IssuerURL}}/.well-known/openid-configuration">/.well-known/openid-configuration</a> &middot;
    JWKS: <a href="{{.IssuerURL}}/.well-known/jwks.json">/.well-known/jwks.json</a></p>
</div>
{{end}}
