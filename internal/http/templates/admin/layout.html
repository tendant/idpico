{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "title" .}} - Simple IdP Admin</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            color: #333;
            margin: 0;
            font-size: 15px;
        }
        header {
            background: #1f2937;
            color: white;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }
        header .brand { font-weight: 600; font-size: 17px; color: white; text-decoration: none; }
        header nav a {
            color: #d1d5db;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }
        header nav a:hover, header nav a.active { color: white; }
        header .user { color: #9ca3af; font-size: 13px; }
        header .user a { color: #d1d5db; margin-left: 12px; }
        main { max-width: 1100px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 22px; font-weight: 600; margin: 0 0 20px 0; }
        h2 { font-size: 16px; font-weight: 600; margin: 32px 0 12px 0; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            padding: 24px;
            margin-bottom: 24px;
        }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden; }
        th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid #eee; vertical-align: top; }
        th { background: #fafafa; font-weight: 600; font-size: 13px; color: #555; }
        tr:last-child td { border-bottom: none; }
        td.actions { white-space: nowrap; text-align: right; }
        code { background: #f3f4f6; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
        .muted { color: #6b7280; font-size: 13px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
        .badge.on { background: #d1fae5; color: #065f46; }
        .badge.off { background: #f3f4f6; color: #6b7280; }
        .badge.warn { background: #fef3c7; color: #92400e; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .stat { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 20px; }
        .stat .n { font-size: 30px; font-weight: 600; }
        .stat a { color: #6b7280; font-size: 13px; text-decoration: none; }
        form.inline { display: inline; }
        .form-row { margin-bottom: 16px; }
        .form-row.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        label { display: block; font-weight: 500; font-size: 13px; color: #555; margin-bottom: 6px; }
        label.check { display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 14px; color: #333; }
        input[type="text"], input[type="email"], input[type="password"], textarea, select {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea { min-height: 80px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #2563eb; }
        .help { color: #6b7280; font-size: 12px; margin-top: 4px; }
        button, .button {
            display: inline-block;
            padding: 8px 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
        }
        button:hover, .button:hover { background: #1d4ed8; }
        button.secondary, .button.secondary { background: #e5e7eb; color: #111; }
        button.secondary:hover, .button.secondary:hover { background: #d1d5db; }
        button.danger, .button.danger { background: #dc2626; }
        button.danger:hover, .button.danger:hover { background: #b91c1c; }
        button.small, .button.small { padding: 5px 10px; font-size: 13px; }
        .flash { padding: 12px 14px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
        .flash.ok { background: #d1fae5; color: #065f46; }
        .flash.err { background: #fee2e2; color: #991b1b; }
        .secret-box { background: #fffbeb; border: 1px solid #fcd34d; padding: 14px; border-radius: 4px; margin-bottom: 20px; }
        .secret-box code { font-size: 14px; background: white; }
        .danger-zone { border: 1px solid #fecaca; }
        a { color: #2563eb; }
    </style>
</head>
<body>
    <header>
        <div>
            <a class="brand" href="/admin">Simple IdP</a>
            <nav style="display:inline">
                <a href="/admin/users"{{if eq .Section "users"}} class="active"{{end}}>Users</a>
                <a href="/admin/groups"{{if eq .Section "groups"}} class="active"{{end}}>Groups</a>
                <a href="/admin/clients"{{if eq .Section "clients"}} class="active"{{end}}>Clients</a>
                <a href="/admin/keys"{{if eq .Section "keys"}} class="active"{{end}}>Signing Keys</a>
                <a href="/admin/audit"{{if eq .Section "audit"}} class="active"{{end}}>Audit</a>
            </nav>
        </div>
        <div class="user">{{.CurrentUser.Email}} <a href="/logout">Sign out</a></div>
    </header>
    <main>
        {{if .Flash}}<div class="flash ok">{{.Flash}}</div>{{end}}
        {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
        {{template "content" .}}
    </main>
</body>
</html>{{end}}
