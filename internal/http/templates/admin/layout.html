{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{template "title" .}} - IDPico Admin</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="128x128" href="{{asset "icon.png"}}">
    <link rel="apple-touch-icon" href="{{asset "icon.png"}}">
    <link rel="stylesheet" href="{{asset "style.css"}}">
</head>
<body>
    <header class="site">
        <div>
            <a class="brand" href="/admin"><img src="{{asset "icon.png"}}" alt="">IDPico</a>
            <nav>
                <a href="/admin/users"{{if eq .Section "users"}} class="active"{{end}}>Users</a>
                <a href="/admin/groups"{{if eq .Section "groups"}} class="active"{{end}}>Groups</a>
                <a href="/admin/clients"{{if eq .Section "clients"}} class="active"{{end}}>Clients</a>
                <a href="/admin/keys"{{if eq .Section "keys"}} class="active"{{end}}>Signing Keys</a>
                <a href="/admin/audit"{{if eq .Section "audit"}} class="active"{{end}}>Audit</a>
                <a href="/playground">Playground</a>
            </nav>
        </div>
        <div class="user">{{.CurrentUser.Email}} <a href="/logout">Sign out</a></div>
    </header>
    <main>
        {{if .Flash}}<div class="flash ok">{{.Flash}}</div>{{end}}
        {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
        {{template "content" .}}
    </main>
</body>
</html>{{end}}
