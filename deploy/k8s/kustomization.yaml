apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: idpico
# Point the image at your registry:
#   kustomize edit set image idpico=registry.example.com/idpico:0.0.2
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# Create the secret out of band (never commit it):
#   kubectl -n idpico create secret generic idpico-secrets \
#     --from-literal=cookie-secret="$(openssl rand -base64 32)" \
#     --from-literal=client-secret="$(openssl rand -base64 32)" \
#     --from-literal=bootstrap-users="admin@example.com:change-me:Admin"
