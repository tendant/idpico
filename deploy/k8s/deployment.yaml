apiVersion: apps/v1
kind: Deployment
metadata:
  name: idpico
  labels:
    app: idpico
spec:
  replicas: 1
  strategy:
    type: Recreate   # the SQLite volume cannot be shared between two pods
  selector:
    matchLabels:
      app: idpico
  template:
    metadata:
      labels:
        app: idpico
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001    # the "idp" user baked into the image
        runAsGroup: 10001
        fsGroup: 10001      # so the volume is writable by that user
      containers:
        - name: idpico
          image: wang/idpico:v0.0.8   # `make docker-push` also updates :latest; keep this pinned
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: IDPICO_HOST
              value: "0.0.0.0"
            - name: IDPICO_PORT
              value: "8080"
            # Must match the external URL exactly (scheme, host, no trailing slash)
            - name: IDPICO_ISSUER_URL
              value: "https://idp.example.com"
            - name: IDPICO_DATA_DIR
              value: "/app/data"
            - name: IDPICO_COOKIE_SECURE
              value: "true"
            # Only once idp.example.com is https-only: browsers remember it for a year
            - name: IDPICO_HSTS_MAX_AGE
              value: "31536000"
            # Peers whose X-Forwarded-For names the client (rate limits, audit log).
            # "private" covers an in-cluster ingress; use the LB's CIDRs if it has a public IP.
            - name: IDPICO_TRUSTED_PROXIES
              value: "private"
            - name: IDPICO_LOG_FORMAT
              value: "json"
            - name: IDPICO_COOKIE_SECRET
              valueFrom:
                secretKeyRef: { name: idpico-secrets, key: cookie-secret }
            - name: IDPICO_BOOTSTRAP_USERS
              valueFrom:
                secretKeyRef: { name: idpico-secrets, key: bootstrap-users }
            - name: IDPICO_ADMIN_EMAILS
              value: "admin@example.com"
            - name: IDPICO_BOOTSTRAP_GROUPS
              value: "cluster-admins:admin@example.com"
            # First OIDC client (e.g. Headlamp); add more via the admin UI or idpicoctl
            - name: IDPICO_CLIENT_ID
              value: "headlamp"
            - name: IDPICO_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: idpico-secrets, key: client-secret }
            - name: IDPICO_CLIENT_REDIRECT_URI
              value: "https://k8s.example.com/oidc-callback"
            # Shared deployment: turn the built-in test client off
            - name: IDPICO_PLAYGROUND_ENABLED
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: idpico-data
